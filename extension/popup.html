<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #899c85; /* Sage green */
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #768772;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }
    .success { color: #2e7d32; }
    .error { color: #d32f2f; }
    
    /* Settings section */
    .settings-toggle {
      font-size: 11px;
      color: #666;
      text-decoration: underline;
      cursor: pointer;
      text-align: right;
      display: block;
      margin-top: 16px;
    }
    #settings-panel {
      display: none;
      background: #f9f9f9;
      padding: 12px;
      border-radius: 4px;
      margin-top: 12px;
      border: 1px solid #eee;
    }
    .show-settings #settings-panel {
      display: block;
    }
  </style>
</head>
<body>
  <h2>Curvy Girls Importer</h2>
  
  <div id="main-panel">
    <button id="import-btn">Import this Product</button>
  </div>

  <div id="status"></div>

  <span class="settings-toggle" id="toggle-settings">⚙️ Settings</span>

  <div id="settings-panel">
    <div class="group">
      <label>API URL</label>
      <input type="text" id="api-url" placeholder="https://your-domain.com">
    </div>
    <div class="group">
      <label>Secret Token</label>
      <input type="password" id="secret-token" placeholder="Extension Secret Token">
    </div>
    <button id="save-settings" style="background: #555;">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
