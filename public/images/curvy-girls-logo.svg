  <!-- Skirt right / Slit inner -->
  <path d="M68,105 C78,130 63,195 53,200 C60,160 63,130 53,105 Z" fill="#c35b71"/>
  
  <!-- Line Art Strokes -->
  <g stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Arm/Sleeve -->
    <path d="M48,60 C33,65 18,85 23,105 C33,95 38,95 43,95"/>
    
    <!-- Right Arm/Sleeve -->
    <path d="M58,60 C73,65 88,85 83,105 C73,95 68,95 63,95"/>
    
    <!-- V-neck -->
    <path d="M43,60 C48,80 53,100 53,100 C53,100 58,80 63,60"/>
    
    <!-- Waistband -->
    <path d="M38,100 C48,98 58,98 68,100"/>
    <path d="M38,105 C48,103 58,103 68,105"/>
    
    <!-- Skirt Outer Hips -->
    <path d="M38,105 C28,130 43,195 53,205"/>
    <path d="M68,105 C78,130 63,195 53,190"/>
    
    <!-- Slit line -->
