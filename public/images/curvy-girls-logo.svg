  <!-- Hair base -->
  <path d="M53,18 C38,15 33,35 40,48 C33,55 43,65 50,58 C53,55 56,50 53,45 C63,40 68,55 63,65 C70,60 73,45 63,30 C63,22 58,18 53,18 Z" fill="#111111"/>
  
  <!-- Face/Jawline outline -->
  <path d="M50,38 C53,48 56,52 60,48" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Left Sleeve (viewer left) -->
  <path d="M48,60 C33,65 18,85 23,105 C33,95 38,95 43,95 Z" fill="#f4d1db"/>
  <!-- Right Sleeve (viewer right) -->
  <path d="M58,60 C73,65 88,85 83,105 C73,95 68,95 63,95 Z" fill="#f4d1db"/>
  
  <!-- Bodice (V-neck simulation) -->
  <path d="M43,60 L53,100 L38,100 Z" fill="#f4d1db"/>
  <path d="M63,60 L53,100 L68,100 Z" fill="#f4d1db"/>
  
  <!-- Skirt left -->
